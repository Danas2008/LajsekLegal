{% extends 'dashboard/base_dashboard.html' %}

{% block title %}Smazat článek{% endblock %}

{% block dash_content %}
  <div class="dash-title">
    <h1>Smazat článek</h1>
  </div>

  <div class="dash-card">
    <p>Opravdu chcete smazat článek <strong>{{ post.title }}</strong>? Tuto akci nelze vrátit zpět.</p>
    <div class="dash-form-actions" style="margin-top:24px;">
      <form method="post">
        {% csrf_token %}
        <button class="button" type="submit" style="background:#a33;">Smazat</button>
      </form>
      <a class="text-link" href="{% url 'dashboard:blog_list' %}">Zrušit</a>
    </div>
  </div>
{% endblock %}
