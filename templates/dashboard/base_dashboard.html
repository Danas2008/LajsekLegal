{% load static %}
<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>{% block title %}Dashboard{% endblock %} | Lajsek Legal</title>
    <link rel="icon" href="{% static 'img/ikon.ico' %}" />
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
    <link rel="stylesheet" href="{% static 'css/dashboard.css' %}" />
  </head>
  <body class="dash-body">
    <div class="dash-shell">
      <aside class="dash-sidebar">
        <a class="dash-brand" href="{% url 'dashboard:home' %}">
          <strong>LAJSEK LEGAL</strong><span>Dashboard</span>
        </a>
        <nav class="dash-sidenav">
          <a href="{% url 'dashboard:blog_list' %}"
             class="{% if request.resolver_match.url_name in 'blog_list,blog_create,blog_edit,blog_delete' %}active{% endif %}">
            Blog
          </a>
        </nav>
        <div class="dash-sidebar-footer">
          <a href="{% url 'home' %}">← Zpět na web</a>
          <form action="{% url 'admin:logout' %}" method="post">
            {% csrf_token %}
            <button type="submit">Odhlásit se</button>
          </form>
        </div>
      </aside>
      <main class="dash-main">
        {% if messages %}
          <ul class="dash-messages">
            {% for message in messages %}<li>{{ message }}</li>{% endfor %}
          </ul>
        {% endif %}
        {% block dash_content %}{% endblock %}
      </main>
    </div>
  </body>
</html>
