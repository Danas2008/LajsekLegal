{% extends 'dashboard/base_dashboard.html' %}

{% block title %}{{ title }}{% endblock %}

{% block dash_content %}
  <div class="dash-title">
    <h1>{{ title }}</h1>
  </div>

  <div class="dash-card">
    <form method="post">
      {% csrf_token %}
      {% for field in form %}
        <div class="dash-form-row">
          <label for="{{ field.id_for_label }}">{{ field.label }}</label>
          {{ field }}
          {% if field.errors %}<p class="dash-field-error">{{ field.errors|join:', ' }}</p>{% endif %}
        </div>
      {% endfor %}
      <div class="dash-form-actions">
        <button class="button" type="submit">Uložit</button>
        <a class="text-link" href="{% url 'dashboard:faq_list' %}">Zrušit</a>
      </div>
    </form>
  </div>
{% endblock %}
